<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrepUra | Shakes & Sweets</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">CrepUra</div>
        <div class="tagline">Shakes & Sweets</div>
    </header>

    <nav id="category-nav">
        <div class="nav-scroll-wrapper" id="nav-links"></div>
    </nav>

    <main id="menu-container"></main>

    <footer>
        <div class="footer-container">
            <div class="footer-map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3312.4485!2d35.5131!3d33.8938!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzPCsDUzJzM3LjciTiAzNcKwMzAnNDcuMiJF!5e0!3m2!1sen!2slb!4v1620000000000!5m2!1sen!2slb" 
                    width="100%" height="200" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
            <div class="footer-info">
                <h3>Visit Us</h3>
                <p>Beirut, Lebanon</p>
                <div class="social-icons">
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-tiktok"></i></a>
                    <a href="#"><i class="fab fa-whatsapp"></i></a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">© 2026 CrepUra. Built for speed.</div>
    </footer>

    <div id="item-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">×</span>
            <div class="modal-img-container">
                <img src="" id="modal-img">
            </div>
            <div class="modal-text">
                <h2 id="modal-title"></h2>
                <p id="modal-price" class="modal-price"></p>
                <p id="modal-desc"></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
